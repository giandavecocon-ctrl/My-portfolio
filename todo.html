<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a1428;
      font-family: Arial, Helvetica, sans-serif;
      color: #f2ebeb;
    }

    .todo {
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
      padding: 28px;
      margin: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 1.5rem;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      color: #f2ebeb;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #5B4B8A;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #726194;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    li span {
      flex: 1;
      cursor: pointer;
    }

    li.done span {
      text-decoration: line-through;
      color: #8a8a96;
    }

    li button {
      padding: 4px 10px;
      background: transparent;
      border: 1px solid #A99BD1;
      color: #A99BD1;
      font-weight: 400;
    }

    .count {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #c9c3c3;
    }

    .back {
      color: #A99BD1;
      font-size: 0.9rem;
      text-decoration: none;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="todo">
    <h1>My To-Do List</h1>

    <div class="row">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button id="addBtn">Add</button>
    </div>

    <ul id="taskList"></ul>
    <p class="count" id="count"></p>
  </div>

  <a href="index.html" class="back">&larr; Back to portfolio</a>

  <script>
    // Grab the elements we need from the page
    const input = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const list = document.getElementById('taskList');
    const count = document.getElementById('count');

    // Our data: an array of tasks like { text: "Study", done: false }
    let tasks = [];

    // Load saved tasks from the browser (if any)
    try {
      tasks = JSON.parse(localStorage.getItem('tasks')) || [];
    } catch (e) {
      tasks = [];
    }

    // Save tasks to the browser so they stay after a refresh
    function save() {
      try {
        localStorage.setItem('tasks', JSON.stringify(tasks));
      } catch (e) {}
    }

    // Redraw the whole list from the tasks array
    function render() {
      list.innerHTML = '';

      tasks.forEach(function (task, index) {
        const li = document.createElement('li');
        if (task.done) li.className = 'done';

        // Clicking the text toggles done / not done
        const span = document.createElement('span');
        span.textContent = task.text;
        span.onclick = function () {
          task.done = !task.done;
          save();
          render();
        };

        // The delete button removes this task
        const del = document.createElement('button');
        del.textContent = 'Delete';
        del.onclick = function () {
          tasks.splice(index, 1);
          save();
          render();
        };

        li.append(span, del);
        list.appendChild(li);
      });

      const left = tasks.filter(function (t) { return !t.done; }).length;
      count.textContent = left + (left === 1 ? ' task left' : ' tasks left');
    }

    // Add a new task from the input box
    function addTask() {
      const text = input.value.trim();
      if (text === '') return;

      tasks.push({ text: text, done: false });
      input.value = '';
      save();
      render();
    }

    addBtn.onclick = addTask;
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') addTask();
    });

    render();
  </script>

</body>
</html>
